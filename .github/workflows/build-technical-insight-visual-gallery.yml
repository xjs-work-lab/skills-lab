name: Build Technical Insight Visual Gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'presentation/technical-insight-presentation/scripts/**'
      - 'presentation/technical-insight-presentation/templates/**'
      - '.github/workflows/build-technical-insight-visual-gallery.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested production dependencies
        run: |
          npm install --no-save pptxgenjs
          python -m pip install python-pptx pillow
          command -v libreoffice || (sudo apt-get update && sudo apt-get install -y libreoffice)
          command -v pdftoppm || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Generate 4 editable cross-palette/domain demos and full-res rendered QA
        run: |
          set -eu
          BASE=presentation/technical-insight-presentation
          OUT="$BASE/visual-gallery"
          mkdir -p "$OUT"
          node "$BASE/scripts/make_template_deck.js" --palette forest --out "$OUT/demo-forest-editable.pptx"
          node "$BASE/scripts/make_template_deck.js" --palette plum --out "$OUT/demo-plum-editable.pptx"
          node "$BASE/scripts/make_template_deck.js" --palette forest --content-json "$BASE/templates/content-thermal.example.json" --out "$OUT/demo-thermal-forest-editable.pptx"
          node "$BASE/scripts/make_template_deck.js" --palette plum --content-json "$BASE/templates/content-compiler.example.json" --out "$OUT/demo-compiler-plum-editable.pptx"
          for NAME in forest plum thermal-forest compiler-plum; do
            python "$BASE/scripts/render_and_qa.py" "$OUT/demo-$NAME-editable.pptx" --outdir "/tmp/tip-$NAME" --dpi 120
            cp "/tmp/tip-$NAME/contact-sheet.png" "$OUT/demo-$NAME-contact-sheet.png"
            cp "/tmp/tip-$NAME/QA.json" "$OUT/demo-$NAME-QA.json"
          done
      - name: Commit reproducible visual-gallery PPTX and screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation/technical-insight-presentation/visual-gallery/
          if git diff --staged --quiet; then
            echo "Gallery already current"
          else
            git commit -m "build: track 4 editable cross-domain and multi-palette slide galleries"
            git push origin HEAD:main
          fi
